# ─────────────────────────────────────────────────────────────────────────────
#  CRYSTAL — parametri di default
#
#  Non toccare questo file per fare un video: crea (o copia) un preset in
#  presets/ e scrivici SOLO le chiavi che vuoi cambiare. Vedi README.md.
#
#  Questi valori sono il tuo ultimo config della v3 (agosto 2025), cioè il look
#  dei video "Natisone Trip".
#
#  Convenzioni:
#   • misure in pixel = riferite alla risoluzione PIENA del formato scelto
#     (in --test vengono scalate da sole, così il test somiglia al finale)
#   • tempi in secondi, velocità in px al secondo: cambiando fps il movimento non cambia
#   • audio = reattività 0-1 di ogni effetto (0 = ignora la musica)
#   • colori = [R, G, B] 0-255
# ─────────────────────────────────────────────────────────────────────────────

seed = 0   # 0 = casuale. Il seed usato viene salvato nel .json accanto al video

[output]
format      = "ig_post"   # ig_story 1080x1920 | ig_post 1080x1350 | square 1080x1080
                          # landscape 1920x1080 | logo (dimensioni del file logo + padding) | custom
width       = 1080        # usati solo con format = "custom"
height      = 1350
scale       = 1.0         # moltiplicatore di risoluzione (0.5 = metà, veloce)
fps         = 30
duration    = 40          # secondi
crf         = 18          # qualità x264: 0 = lossless, 18 = ottima, 23 = default ffmpeg
x264_preset = "medium"    # ultrafast … veryslow (più lento = file più piccolo)
encoder     = "x264"      # x264 = qualità migliore | videotoolbox = encoder hardware del Mac,
                          # molto più veloce (il bitrate segue crf), file più grandi
dir         = "output"
workers     = 0           # processi per le deformazioni. 0 = automatico, 1 = niente parallelismo

[test]                    # cosa cambia con --test
scale    = 0.5
fps      = 15
duration = 6

# ─── Logo ────────────────────────────────────────────────────────────────────
[logo]
file         = "input/logo.svg"   # .svg o .pdf (dal PDF si usa la prima pagina)
color        = [255, 255, 255]
padding      = 40         # margine attorno al logo
left_padding = 20         # spostamento orizzontale extra (+ = verso destra)
zoom         = 1.0
fill         = "blob"     # blob  = sagoma piena (il look dei video v3)
                          # none  = il logo esattamente com'è nell'SVG
                          # holes = come none ma con i buchi interni riempiti

# ─── Video di sfondo ─────────────────────────────────────────────────────────
[background]
enabled      = true
video        = "input/sfondo.mov"   # un file, un glob ("input/fiume*.MOV") o una lista → ne sceglie uno
fit          = "cover"    # cover = riempie il frame | crop = ritaglio manuale con crop_*
zoom         = 1.2        # solo cover
slowdown     = 1.0        # 2 = metà velocità, 0.5 = doppia
brightness   = 0.66       # luminosità dello sfondo (1 = invariata, 0.5 = metà)
random_start = true       # parte da un punto a caso (entro i primi 2/3)
start        = 0.0        # secondo di partenza se random_start = false
crop_x       = 0.6        # solo fit = "crop": posizione e dimensione del ritaglio (0-1)
crop_y       = 0.0
crop_w       = 1.0
crop_h       = 0.5

# ─── Texture (immagine fusa su logo e/o sfondo) ──────────────────────────────
[texture]
enabled          = false
path             = "input/texture.jpg"
target           = "both"     # logo | background | both
alpha            = 0.6        # opacità sul logo
background_alpha = 0.8        # opacità sullo sfondo
mode             = "multiply" # vedi blend mode nel README

# ─── Glow ────────────────────────────────────────────────────────────────────
[glow]
enabled   = true
size      = 20        # raggio del bagliore
intensity = 0.3       # pulsa da sola di +0.2 a metà video

# ─── Deformazione organica: ondulazioni morbide (Perlin) ─────────────────────
[organic]
enabled = true
amount  = 20.0            # quanto si sposta il logo (px)
size    = 1000            # grandezza delle onde (px): piccolo = increspato, grande = ondeggia tutto
period  = 4.2             # in quanti secondi le onde cambiano forma (piccolo = agitato)
audio   = 0.4             # i bassi le rendono più ampie e più veloci (0 = niente)

# ─── Deformazione stretch: stiramenti lunghi ─────────────────────────────────
[stretch]
enabled    = true
horizontal = 225          # stiramento orizzontale (px; lo spostamento massimo è circa 2/3)
vertical   = 4            # stiramento verticale (px)
size       = 670          # lunghezza degli stiramenti (px)
period     = 110          # in quanti secondi cambiano forma (sopra la durata del video = quasi fermi)
audio      = 0.0          # i bassi li rendono più ampi e più veloci

# ─── Lenti: "creature" che deformano il logo passandoci sopra ────────────────
[lenses]
enabled                   = true
motion                    = "paths"  # paths = percorsi geometrici (look v3) | drift = nascono sul logo e
                                     # vagano piano, trasportate da correnti organiche (le chiavi drift_*)
count             = 60
min_strength      = -0.5     # negativo = ingrandisce, positivo = rimpicciolisce.
max_strength      = 0.8      # oltre ±1 la lente ripiega l'immagine su se stessa
min_radius        = 10
max_radius        = 120      # le lenti piccole sono molte più delle grandi
speed             = 0        # px al secondo (0 = ferme: il look v3; 10 = lente, 60 = vivaci)
inertia           = 0.95     # morbidezza del movimento (0.5 = segue di scatto, 0.95 = fluido)
audio             = 0.3      # i bassi le accelerano, i medi le rendono più forti
drift_scale       = 350      # drift: grandezza delle correnti in px (piccolo = vortici fitti)
drift_change      = 1.0      # drift: quanto in fretta le correnti cambiano nel tempo
drift_turbulence  = 0.35     # drift: 0 = si muovono tutte insieme col flusso, 1 = ognuna per conto suo
drift_follow_logo = 0.6      # drift: quanto le tiene sul logo (0 = libere di andarsene)
worm              = true     # forma allungata e ondulata
worm_length       = 1.5      # 1 = tonda
worm_wave         = 30       # ampiezza dell'ondulazione del verme (px)

# ─── Scie (tracers) ──────────────────────────────────────────────────────────
[tracers.logo]            # scie dei bordi del logo
enabled   = true
trail     = 85            # lunghezza in frame (a 30 fps)
opacity   = 0.18
color     = [27, 37, 37]
hue_shift = 0.5           # cambio di tinta lungo la scia

[tracers.background]      # scie dei contorni del video di sfondo
enabled    = true
trail      = 105
opacity    = 0.12
color      = [40, 40, 40]
hue_shift  = 0.3
threshold  = 21           # più basso = più contorni (su acqua e fumo alzarlo)

# ─── Fusione logo / sfondo ───────────────────────────────────────────────────
[blend]
enabled = true            # false = logo incollato sopra, senza fusione
preset  = "soft"          # cinematic artistic soft dramatic bright intense psychedelic
                          # glow dark geometric | manual
# Le chiavi qui sotto valgono con preset = "manual". Con un preset, quelle che
# scrivi nel TUO file preset lo sovrascrivono.
mode            = "multiply"
strength        = 0.5     # 0 = logo trasparente, 1 = fusione piena
edge_detection  = true    # i bordi del logo fusi a parte, più marcati
edge_blur       = 3
harmonize       = true    # il logo prende il colore medio dello sfondo…
color_strength  = 0.8     # …in questa misura
luminance_match = true    # il logo prende la luminosità dello sfondo
edge_softness   = 0       # sfumatura del bordo del logo (px)

# ─── Audio ───────────────────────────────────────────────────────────────────
[audio]
enabled      = true
files        = ["input/audio1.aif", "input/audio2.aif"]   # anche glob; ne sceglie uno
random_start = true
start        = 0.0        # secondo di partenza se random_start = false
mux          = true       # mette la traccia nel video finale
smoothing    = 0.95       # morbidezza della reazione (0.6 = segue ogni colpo, 0.95 = fluido)
                          # quanto reagisce ogni effetto: la chiave audio di organic, stretch, lenses
