# Sciame — Crystal Therapy con tante lenti piccole che vagano piano sulla scritta,
# trasportate da correnti organiche (lenses.motion = "drift").

[output]
format = "custom"
width  = 1576
height = 1160

[logo]
file         = "input/logo.pdf"
fill         = "none"
left_padding = 0

[background]
zoom     = 1.1
slowdown = 1.3
brightness = 0.7

[lenses]
motion            = "drift"
count             = 220
min_strength      = -0.6
max_strength      = 0.9
min_radius        = 6
max_radius        = 34      # piccole: la maggior parte sta sotto i 15 px
worm_length       = 1.4
worm_wave         = 8
speed             = 15      # px/s
drift_scale       = 300
drift_turbulence  = 0.35
drift_follow_logo = 0.7

[tracers.logo]
trail   = 35
opacity = 0.15

[tracers.background]
trail      = 65
threshold  = 20
