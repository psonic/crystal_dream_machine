# Delirio — tutto più forte e più veloce: lenti che si muovono davvero,
# scie colorate, fusione psichedelica, sfondo a caso fra fiumi e ghiaccio.

[output]
format   = "ig_story"
duration = 20

[logo]
color = [255, 240, 250]

[background]
video    = ["input/fiume*.MOV", "input/ghiaccio.MOV", "input/fumo*.MOV"]
slowdown = 1.5
brightness = 0.77

[organic]
period = 1.7          # onde nervose
amount = 30.0

[stretch]
period     = 11
horizontal = 270
vertical   = 135

[lenses]
count               = 80
min_strength        = -1.2
max_strength        = 1.4
max_radius          = 150
speed               = 45      # px/s
audio               = 0.5
worm_length         = 2.5
worm_wave           = 45

[tracers.logo]
color     = [220, 200, 255]
opacity   = 0.05
hue_shift = 2.0

[tracers.background]
color     = [200, 170, 200]
opacity   = 0.015       # su acqua/fumo i contorni sono ovunque: tenerla bassa
hue_shift = 1.0

[blend]
preset = "psychedelic"

[audio]
smoothing = 0.6       # reagisce a ogni colpo
